<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>API - Ejercicios de Pruebas de Caja Negra</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
<style>
  body { margin: 0; }
  .topbar { display: none; } /* oculta la barra superior de Swagger con el logo/URL editable */
</style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
      });
    };
  </script>
</body>
</html>
