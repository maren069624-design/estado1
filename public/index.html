<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Ejercicios de Pruebas de Caja Negra</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h2 { margin-top: 32px; font-size: 1.1rem; color: #555; }
  a.ejercicio { display: block; padding: 14px 18px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: #1a1a1a; }
  a.ejercicio:hover { background: #f7f7f7; }
</style>
</head>
<body>
  <h1>Ejercicios de Pruebas de Caja Negra</h1>

  <h2>Transición de Estados</h2>
  <div id="lista-estados">Cargando...</div>

  <h2>Tablas de Decisión</h2>
  <div id="lista-decision">Cargando...</div>

  <script>
    fetch("/api/ejercicios")
      .then((r) => r.json())
      .then((lista) => {
        const div = document.getElementById("lista-estados");
        div.innerHTML = "";
        lista.forEach((ej) => {
          const a = document.createElement("a");
          a.className = "ejercicio";
          a.href = `/ejercicio.html?slug=${ej.slug}`;
          a.textContent = ej.nombre;
          div.appendChild(a);
        });
        if (lista.length === 0) div.textContent = "No hay ejercicios cargados.";
      });

    fetch("/api/decisiones")
      .then((r) => r.json())
      .then((lista) => {
        const div = document.getElementById("lista-decision");
        div.innerHTML = "";
        lista.forEach((ej) => {
          const a = document.createElement("a");
          a.className = "ejercicio";
          a.href = `/decision.html?slug=${ej.slug}`;
          a.textContent = ej.nombre;
          div.appendChild(a);
        });
        if (lista.length === 0) div.textContent = "No hay ejercicios cargados.";
      });
  </script>
</body>
</html>
